name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch (or PR) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test with coverage (library threshold 90%)
        run: npm test
      - name: Build the library, CLI and web app
        run: npm run build
      - name: Smoke-test the built CLI and library
        run: |
          node packages/contrastkit/dist/cli.js audit examples/tokens.json
          node examples/library.mjs
